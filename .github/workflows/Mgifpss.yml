          package dev.sam.fpscounter;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import rikka.shizuku.Shizuku;

          public class MainActivity extends Activity {

              private static final int REQ_OVERLAY = 1;
              private static final int SHIZUKU_CODE = 100;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  // layout
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackgroundColor(0xFF000000);
                  root.setPadding(48, 48, 48, 48);

                  TextView title = new TextView(this);
                  title.setText("FPS Counter");
                  title.setTextColor(0xFFFFFFFF);
                  title.setTextSize(24);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText("Overlay arrastável com FPS real via Shizuku");
                  info.setTextColor(0xFFAAAAAA);
                  info.setTextSize(13);
                  info.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, 12, 0, 32);
                  info.setLayoutParams(lp);
                  root.addView(info);

                  // campo package
                  TextView pkgLabel = new TextView(this);
                  pkgLabel.setText("Package do jogo:");
                  pkgLabel.setTextColor(0xFFCCCCCC);
                  pkgLabel.setTextSize(13);
                  root.addView(pkgLabel);

                  EditText pkgField = new EditText(this);
                  pkgField.setHint("ex: com.mihoyo.hkrpg");
                  pkgField.setTextColor(0xFFFFFFFF);
                  pkgField.setHintTextColor(0xFF666666);
                  pkgField.setBackgroundColor(0xFF111111);
                  pkgField.setPadding(24, 16, 24, 16);
                  pkgField.setText(getPreferences(MODE_PRIVATE).getString("pkg", ""));
                  LinearLayout.LayoutParams epLp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  epLp.setMargins(0, 8, 0, 24);
                  pkgField.setLayoutParams(epLp);
                  root.addView(pkgField);

                  Button btnStart = makeBtn("Iniciar Overlay");
                  Button btnStop  = makeBtn("Parar Overlay");
                  btnStop.setAlpha(0.5f);

                  btnStart.setOnClickListener(v -> {
                      String pkg = pkgField.getText().toString().trim();
                      if (pkg.isEmpty()) {
                          Toast.makeText(this, "Digite o package do jogo", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      getPreferences(MODE_PRIVATE).edit().putString("pkg", pkg).apply();

                      if (!Settings.canDrawOverlays(this)) {
                          Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName()));
                          startActivityForResult(i, REQ_OVERLAY);
                          return;
                      }
                      if (!Shizuku.pingBinder()) {
                          toast("Shizuku não está rodando");
                          return;
                      }
                      if (Shizuku.checkSelfPermission() != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          Shizuku.requestPermission(SHIZUKU_CODE);
                          return;
                      }
                      startOverlay(pkg);
                  });

                  btnStop.setOnClickListener(v -> {
                      stopService(new Intent(this, OverlayService.class));
                      toast("Overlay parado");
                      btnStart.setAlpha(1f);
                      btnStop.setAlpha(0.5f);
                  });

                  Shizuku.addRequestPermissionResultListener((code, result) -> {
                      if (result == android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          String pkg = pkgField.getText().toString().trim();
                          if (!pkg.isEmpty()) startOverlay(pkg);
                      } else {
                          toast("Permissão Shizuku negada");
                      }
                  });

                  root.addView(btnStart);

                  LinearLayout.LayoutParams stopLp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  stopLp.setMargins(0, 12, 0, 0);
                  btnStop.setLayoutParams(stopLp);
                  root.addView(btnStop);

                  TextView note = new TextView(this);
                  note.setText("Arraste o contador pela tela enquanto joga.\nDeixe em branco para medir FPS global.");
                  note.setTextColor(0xFF666666);
                  note.setTextSize(11);
                  note.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams noteLp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  noteLp.setMargins(0, 32, 0, 0);
                  note.setLayoutParams(noteLp);
                  root.addView(note);

                  setContentView(root);
              }

              private void startOverlay(String pkg) {
                  Intent i = new Intent(this, OverlayService.class);
                  i.putExtra("pkg", pkg);
                  startForegroundService(i);
                  toast("Overlay iniciado");
              }

              private Button makeBtn(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(0xFFFFFFFF);
                  b.setBackgroundColor(0xFF222222);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  b.setLayoutParams(lp);
                  return b;
              }

              private void toast(String msg) {
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ_OVERLAY && Settings.canDrawOverlays(this)) {
                      String pkg = getPreferences(MODE_PRIVATE).getString("pkg", "");
                      if (!pkg.isEmpty()) startOverlay(pkg);
                  }
              }
          }
          EOF

          # ── OverlayService.java ───────────────────────────────────
          cat > app/src/main/java/dev/sam/fpscounter/OverlayService.java <<'EOF'
          package dev.sam.fpscounter;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.WindowManager;
          import android.widget.TextView;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.util.ArrayList;
          import java.util.List;

          import rikka.shizuku.Shizuku;
          import rikka.shizuku.ShizukuRemoteProcess;

          public class OverlayService extends Service {

              private static final String CH = "fps_overlay";
              private static final int NOTIF_ID = 42;
              // número de frames a acumular antes de calcular média (1 seg a 60fps ≈ 60 frames)
              private static final int SAMPLE_WINDOW = 60;

              private WindowManager wm;
              private TextView fpsView;
              private WindowManager.LayoutParams params;
              private Handler handler = new Handler(Looper.getMainLooper());
              private String targetPkg = "";
              private boolean running = false;

              // timestamps FRAME_COMPLETED do framestats — nanoseconds
              private final List<Long> frameTimes = new ArrayList<>();

              @Override
              public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  createNotifChannel();
                  startForeground(NOTIF_ID, buildNotif());
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null) targetPkg = intent.getStringExtra("pkg");
                  if (targetPkg == null) targetPkg = "";
                  startOverlay();
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent i) { return null; }

              @Override
              public void onDestroy() {
                  running = false;
                  handler.removeCallbacksAndMessages(null);
                  if (fpsView != null) {
                      try { wm.removeView(fpsView); } catch (Exception ignored) {}
                      fpsView = null;
                  }
                  super.onDestroy();
              }

              // ── overlay view ─────────────────────────────────────
              private void startOverlay() {
                  if (fpsView != null) return;

                  fpsView = new TextView(this);
                  fpsView.setText("-- FPS");
                  fpsView.setTextColor(Color.WHITE);
                  fpsView.setTextSize(14);           // tamanho compacto estilo MSI
                  fpsView.setTypeface(Typeface.MONOSPACE);
                  fpsView.setBackgroundColor(Color.BLACK);
                  fpsView.setPadding(10, 4, 10, 4);

                  params = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                          | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 0;
                  params.y = 100;

                  // drag
                  fpsView.setOnTouchListener(new DragListener());

                  wm.addView(fpsView, params);
                  running = true;
                  scheduleRead();
              }

              // ── leitura via Shizuku ───────────────────────────────
              private void scheduleRead() {
                  handler.postDelayed(() -> {
                      if (!running) return;
                      new Thread(this::readFramestats).start();
                      scheduleRead();
                  }, 1000);
              }

              private void readFramestats() {
                  try {
                      // dumpsys gfxinfo <pkg> framestats — requer permissão adb
                      String cmd = targetPkg.isEmpty()
                          ? "dumpsys SurfaceFlinger --latency"
                          : "dumpsys gfxinfo " + targetPkg + " framestats";

                      ShizukuRemoteProcess p = Shizuku.newProcess(new String[]{"sh", "-c", cmd}, null, null);
                      BufferedReader br = new BufferedReader(new InputStreamReader(p.getInputStream()));

                      List<Long> newTimes = new ArrayList<>();
                      String line;
                      boolean inFrames = false;

                      while ((line = br.readLine()) != null) {
                          line = line.trim();

                          // framestats header
                          if (line.startsWith("---PROFILEDATA---")) { inFrames = true; continue; }
                          if (!inFrames) continue;
                          if (line.startsWith("---PROFILEDATA---")) break; // segundo marker = fim

                          // cada linha: INTENDED_VSYNC VSYNC OLDEST_INPUT_EVENT NEWEST_INPUT_EVENT
                          //             RENDER_START RENDER_DONE FRAME_COMPLETED
                          // 7 colunas separadas por espaço/tab
                          String[] cols = line.split("\\s+");
                          if (cols.length < 7) continue;
                          try {
                              long frameCompleted = Long.parseLong(cols[6]);
                              if (frameCompleted > 0) newTimes.add(frameCompleted);
                          } catch (NumberFormatException ignored) {}
                      }
                      br.close();
                      p.destroy();

                      int fps = calcFps(newTimes);
                      handler.post(() -> {
                          if (fpsView != null) fpsView.setText(fps + " FPS");
                      });

                  } catch (Exception e) {
                      handler.post(() -> {
                          if (fpsView != null) fpsView.setText("ERR");
                      });
                  }
              }

              // ── cálculo de FPS ────────────────────────────────────
              // usa timestamps FRAME_COMPLETED em nanoseconds
              // FPS = (N-1 frames) / (último - primeiro) convertido para segundos
              private int calcFps(List<Long> times) {
                  // merge com janela existente, mantém só os últimos SAMPLE_WINDOW
                  synchronized (frameTimes) {
                      frameTimes.addAll(times);
                      // remove duplicatas e ordena
                      java.util.TreeSet<Long> sorted = new java.util.TreeSet<>(frameTimes);
                      frameTimes.clear();
                      frameTimes.addAll(sorted);
                      // janela deslizante
                      while (frameTimes.size() > SAMPLE_WINDOW) frameTimes.remove(0);

                      if (frameTimes.size() < 2) return 0;

                      long first = frameTimes.get(0);
                      long last  = frameTimes.get(frameTimes.size() - 1);
                      double seconds = (last - first) / 1_000_000_000.0;
                      if (seconds <= 0) return 0;

                      return (int) Math.round((frameTimes.size() - 1) / seconds);
                  }
              }

              // ── drag ──────────────────────────────────────────────
              private class DragListener implements android.view.View.OnTouchListener {
                  private int initX, initY;
                  private float touchX, touchY;

                  @Override
                  public boolean onTouch(android.view.View v, MotionEvent e) {
                      switch (e.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              initX  = params.x;
                              initY  = params.y;
                              touchX = e.getRawX();
                              touchY = e.getRawY();
                              return true;
                          case MotionEvent.ACTION_MOVE:
                              params.x = initX + (int)(e.getRawX() - touchX);
                              params.y = initY + (int)(e.getRawY() - touchY);
                              wm.updateViewLayout(fpsView, params);
                              return true;
                      }
                      return false;
                  }
              }

              // ── notificação foreground ────────────────────────────
              private void createNotifChannel() {
                  NotificationChannel ch = new NotificationChannel(
                      CH, "FPS Overlay", NotificationManager.IMPORTANCE_LOW);
                  ch.setShowBadge(false);
                  ((NotificationManager) getSystemService(NOTIFICATION_SERVICE))
                      .createNotificationChannel(ch);
              }

              private Notification buildNotif() {
                  return new Notification.Builder(this, CH)
                      .setSmallIcon(android.R.drawable.ic_menu_info_details)
                      .setContentTitle("FPS Counter")
                      .setContentText("Overlay ativo")
                      .setOngoing(true)
                      .build();
              }
          }
          EOF

