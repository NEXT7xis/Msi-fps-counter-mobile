          # ── settings.gradle ───────────────────────────────────────
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FpsCounter"
          include ':app'
          EOF

          # ── build.gradle raiz ────────────────────────────────────
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          # ── gradle.properties ────────────────────────────────────
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          org.gradle.parallel=true
          org.gradle.caching=false
          android.enableR8.fullMode=true
          android.useAndroidX=true
          EOF

          # ── app/build.gradle ─────────────────────────────────────
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'dev.sam.fpscounter'
            compileSdk 34
            defaultConfig {
              applicationId 'dev.sam.fpscounter'
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            signingConfigs {
              release {
                storeFile file('fps.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
              }
            }
            buildTypes {
              release {
                minifyEnabled true
                shrinkResources true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                signingConfig signingConfigs.release
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'dev.rikka.shizuku:api:13.1.5'
            implementation 'dev.rikka.shizuku:provider:13.1.5'
          }
          EOF

          # ── proguard ─────────────────────────────────────────────
          cat > app/proguard-rules.pro <<'EOF'
          -keep class rikka.shizuku.** { *; }
          -keep class dev.sam.fpscounter.** { *; }
          EOF

          # ── AndroidManifest.xml ───────────────────────────────────
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>

            <application
              android:label="FPS Counter"
              android:allowBackup="false"
              android:theme="@android:style/Theme.Material.NoActionBar">

              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>

              <service
                android:name=".OverlayService"
                android:exported="false"
                android:foregroundServiceType="specialUse">
                <property
                  android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                  android:value="fps_overlay"/>
              </service>

